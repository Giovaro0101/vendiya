<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>VendiYA - Plataforma</title>
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='favicon.ico') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/estilo.css') }}" rel="stylesheet">
</head>
<body class="login-body">
<div class="login-container">
  <div class="card login-card">
    <div class="card-body">
      <div class="text-center mb-4">
        <img src="{{ url_for('static', filename='favicon.png') }}" alt="VendiYA" class="login-logo">
        <h1>Panel de la plataforma</h1>
        <p class="text-muted mb-0 small">Acceso del superadministrador</p>
      </div>
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% for cat, msg in messages %}
          <div class="alert alert-{{ cat }} py-2">{{ msg }}</div>
        {% endfor %}
      {% endwith %}
      <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="mb-3"><label class="form-label" for="usuario">Usuario</label>
          <input class="form-control" id="usuario" name="usuario" required autofocus autocapitalize="none" autocomplete="username"></div>
        <div class="mb-4"><label class="form-label" for="password">Contraseña</label>
          <input class="form-control" id="password" name="password" type="password" required autocomplete="current-password"></div>
        <button class="btn btn-primary w-100 btn-lg" type="submit">Entrar</button>
      </form>
    </div>
  </div>
</div>
</body>
</html>
