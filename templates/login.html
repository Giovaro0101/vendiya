<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#F7F7F5">
    <title>VendiYA - Iniciar sesión</title>
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='favicon.ico') }}">
    <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='favicon-32x32.png') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/estilo.css') }}" rel="stylesheet">
</head>
<body class="login-body">
<div class="login-container">
  <div class="card login-card">
    <div class="card-body">
      <div class="text-center mb-4">
        <img src="{{ url_for('static', filename='favicon.png') }}" alt="VendiYA" class="login-logo">
        <h1>Bienvenido a VendiYA</h1>
        <p class="text-muted mb-0 small">Inicia sesión para continuar</p>
      </div>

      {% with messages = get_flashed_messages(with_categories=true) %}
        {% for cat, msg in messages %}
          <div class="alert alert-{{ cat }} py-2">{{ msg }}</div>
        {% endfor %}
      {% endwith %}

      <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="mb-3">
          <label class="form-label" for="negocio">Código del negocio</label>
          <input type="text" name="negocio" id="negocio" class="form-control" value="{{ negocio_codigo or '' }}"
                 placeholder="ej. bodega-la-esquina" required autocomplete="organization"
                 autocapitalize="none" spellcheck="false" maxlength="30">
        </div>
        <div class="mb-3">
          <label class="form-label" for="usuario">Usuario</label>
          <input type="text" name="usuario" id="usuario" class="form-control"
                 placeholder="tu usuario" required autocomplete="username" autocapitalize="none">
        </div>
        <div class="mb-4">
          <label class="form-label" for="password">Contraseña</label>
          <div class="login-pass">
            <input type="password" name="password" id="password" class="form-control"
                   placeholder="••••••••" required autocomplete="current-password">
            <button type="button" onclick="togglePass()" aria-label="Mostrar contraseña">
              <i class="bi bi-eye" id="eyeIcon"></i>
            </button>
          </div>
        </div>
        <button class="btn btn-primary w-100 btn-lg">Entrar</button>
      </form>
      {% if REGISTRO_PUBLICO %}
        <p class="text-center small text-muted mt-4 mb-0">¿Aún no tienes cuenta? <a href="{{ url_for('registro') }}">Crea tu negocio</a></p>
      {% endif %}
    </div>
  </div>
</div>

<script>
// El código del negocio se recuerda en este dispositivo (y el cursor va al primer campo vacío)
(function () {
    const campo = document.getElementById('negocio');
    try {
        if (!campo.value) campo.value = localStorage.getItem('vendiya_negocio') || '';
        document.querySelector('form').addEventListener('submit', () => {
            localStorage.setItem('vendiya_negocio', campo.value.trim().toLowerCase());
        });
    } catch (e) { /* sin almacenamiento */ }
    (campo.value ? document.getElementById('usuario') : campo).focus();

    // Otra cuenta puede entrar en este dispositivo: se descartan las páginas guardadas de la anterior
    if (navigator.serviceWorker && navigator.serviceWorker.controller) {
        navigator.serviceWorker.controller.postMessage({ type: 'LIMPIAR_CACHE' });
    }
})();

function togglePass() {
    const input = document.getElementById('password');
    const icon = document.getElementById('eyeIcon');
    if (input.type === 'password') {
        input.type = 'text';
        icon.classList.replace('bi-eye', 'bi-eye-slash');
    } else {
        input.type = 'password';
        icon.classList.replace('bi-eye-slash', 'bi-eye');
    }
}
</script>
</body>
</html>
