<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Mini Súper{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/estilo.css') }}" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container-fluid">
    <a class="navbar-brand" href="{{ url_for('pos') }}"><i class="bi bi-shop"></i> Mini Súper</a>
    <div class="navbar-nav">
      <a class="nav-link" href="{{ url_for('pos') }}"><i class="bi bi-cart"></i> POS</a>
      <a class="nav-link" href="{{ url_for('productos') }}"><i class="bi bi-box"></i> Productos</a>
      <a class="nav-link" href="{{ url_for('inventario') }}"><i class="bi bi-clipboard-data"></i> Inventario</a>
      <a class="nav-link" href="{{ url_for('ventas') }}"><i class="bi bi-receipt"></i> Ventas</a>
      <a class="nav-link" href="{{ url_for('reportes') }}"><i class="bi bi-graph-up"></i> Reportes</a>
      <a class="nav-link text-warning" href="{{ url_for('logout') }}"><i class="bi bi-box-arrow-right"></i> Salir ({{ session.usuario_nombre }})</a>
    </div>
  </div>
</nav>
<div class="container-fluid mt-3">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for cat, msg in messages %}
        <div class="alert alert-{{ cat }} alert-dismissible fade show">{{ msg }}
          <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
      {% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
